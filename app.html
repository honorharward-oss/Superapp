   КОРЗИНА — функции работы со списком покупок
   ============================================================ */
async function getCart() {
  return await db.shopping_cart.toArray();
}
async function addToCart(recipeId) {
  // Не добавляем дубликаты
  const existing = await db.shopping_cart.where('recipe_id').equals(recipeId).first();
  if (existing) return false;
  await db.shopping_cart.add({ recipe_id: recipeId, added_at: new Date().toISOString() });
  return true;
}
async function removeFromCart(recipeId) {
  await db.shopping_cart.where('recipe_id').equals(recipeId).delete();
}
async function clearCart() {
  await db.shopping_cart.clear();
  await db.shopping_checks.clear();
}
async function isInCart(recipeId) {
  const r = await db.shopping_cart.where('recipe_id').equals(recipeId).first();
  return !!r;
}
async function cartCount() {
  return await db.shopping_cart.count();
}

// Нормализация имени для группировки: «Помидор», «помидоры», «Помидоры свежие» — нужно решить, считать ли одинаковыми.
// Берём строгое сравнение (lowercase + trim). Если нужно — пользователь объединит вручную.
function normalizeIngredientKey(name) {
  return String(name || '').trim().toLowerCase();
}
function capitalize(s) {
  if (!s) return '';
  return s.charAt(0).toUpperCase() + s.slice(1);
}

// Объединить ингредиенты из выбранных рецептов
async function buildShoppingList() {
  const cart = await getCart();
  if (cart.length === 0) return { groups: [], recipes: [] };
  const recipes = [];
  for (const c of cart) {
    const r = await db.recipes.get(c.recipe_id);
    if (r) recipes.push(r);
  }

  // Загружаем карту синонимов: alias → canonical
  const synonyms = await db.ingredient_synonyms.toArray();
  const synMap = new Map();
  synonyms.forEach(s => synMap.set(s.alias, s.canonical));

  // Карта: ключ ингредиента → массив записей { recipeName, weight, parsed }
  const map = new Map();
  recipes.forEach(r => {
    (r.ingredients || []).forEach(ing => {
      if (!ing.name?.trim()) return;
      const rawKey = normalizeIngredientKey(ing.name);
      // Если есть синоним — приводим к каноническому ключу
      const key = synMap.get(rawKey) || rawKey;
      if (!map.has(key)) {
        // Если есть синоним — отображаем каноническое имя; иначе — оригинальное
        const displayName = synMap.has(rawKey)
          ? capitalize(key)
          : ing.name.trim();
        map.set(key, { displayName, entries: [] });
      }
      map.get(key).entries.push({ recipeName: r.name, weight: ing.weight, parsed: parseWeight(ing.weight) });
    });
  });

  // Преобразуем в список групп
  const groups = [];
  for (const [key, val] of map.entries()) {
    // Пробуем суммировать все веса. Если все совместимы — одна строка. Иначе разбиваем по совместимости.
    // Группируем entries по unit
    const buckets = new Map(); // unit (или 'unparsed') → entries
    val.entries.forEach(e => {
      const u = e.parsed.value !== undefined ? e.parsed.unit : 'unparsed';
      if (!buckets.has(u)) buckets.set(u, []);
      buckets.get(u).push(e);
    });

    // Дополнительно: попробуем слить совместимые единицы (г+кг, мл+л)
    const compatibleGroups = mergeCompatibleUnits(buckets);

    compatibleGroups.forEach(bucket => {
      // Суммируем
      let sum = null;
      let canSum = true;
      const recipeNames = new Set();
      bucket.forEach(e => {
        recipeNames.add(e.recipeName);
        if (!canSum) return;
        if (e.parsed.value === undefined) {
          // Не парсится — не суммируем
          canSum = false;
          return;
        }
        if (sum === null) {
          sum = { value: e.parsed.value, unit: e.parsed.unit, raw: e.parsed.raw };
        } else {
          const result = addWeights(sum, e.parsed);
          if (!result) { canSum = false; return; }
          sum = result;
        }
      });

      let weightDisplay;
      if (canSum && sum) {
        weightDisplay = sum.raw || (sum.value + (sum.unit ? ' ' + sum.unit : ''));
      } else {
        // Не смогли сложить — перечислим все исходные веса
        weightDisplay = bucket.map(e => e.weight || '?').filter(Boolean).join(' + ');
      }

      groups.push({
        key: key + '|' + (bucket[0].parsed.unit || 'x') + '|' + Math.random().toString(36).slice(2,6),
        name: val.displayName,
        weight: weightDisplay,
        recipes: [...recipeNames]
      });
    });
  }

  // Сортируем по алфавиту
  groups.sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  return { groups, recipes };
}

function mergeCompatibleUnits(buckets) {
  // Объединяет буклеты с совместимыми единицами в один массив записей
  const result = [];
  const used = new Set();
  const massUnits = ['г','кг','мг'];
  const volumeUnits = ['л','мл'];

  // Группа массы
  const massEntries = [];
  for (const u of massUnits) {
    if (buckets.has(u)) { massEntries.push(...buckets.get(u)); used.add(u); }
  }
  if (massEntries.length) result.push(massEntries);

  // Группа объёма
  const volEntries = [];
  for (const u of volumeUnits) {
    if (buckets.has(u)) { volEntries.push(...buckets.get(u)); used.add(u); }
  }
  if (volEntries.length) result.push(volEntries);

  // Все остальные buckets — каждый отдельно
  for (const [u, entries] of buckets.entries()) {
    if (!used.has(u)) result.push(entries);
  }
  return result;
}

async function renderShoppingList() {
  const root = document.getElementById('app');
  root.innerHTML = '';

  const { groups, recipes } = await buildShoppingList();
  // Загружаем сохранённые галочки
  const checks = {};
  const allChecks = await db.shopping_checks.toArray();

function plural(n, forms) {
  const mod10 = n % 10, mod100 = n % 100;
  if (mod10 === 1 && mod100 !== 11) return forms[0];
  if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return forms[1];
  return forms[2];
}

// === Управление синонимами ингредиентов ===
async function manageSynonyms() {
  const all = await db.ingredient_synonyms.toArray();
  // Группируем по каноническому
  const byCanonical = new Map();
  all.forEach(s => {
    if (!byCanonical.has(s.canonical)) byCanonical.set(s.canonical, []);
    byCanonical.get(s.canonical).push(s.alias);
  });

  openModal('Объединения ингредиентов', (body) => {
    if (byCanonical.size === 0) {
      body.appendChild(E('div', { style:{ textAlign:'center', padding:'30px', color:'var(--text-muted)' }},
        'Объединений пока нет. Создавайте их из списка покупок через кнопку «Объединить».'));
      const footer = E('div', { className:'modal-footer' });
      footer.appendChild(E('span'));
      footer.appendChild(E('button', { className:'btn btn-secondary', onClick: closeModal }, 'Закрыть'));
      body.appendChild(footer);
      return;
    }

    const list = E('div', { style:{ border:'1px solid var(--border)', maxHeight:'60vh', overflowY:'auto' }});
    byCanonical.forEach((aliases, canonical) => {
      const row = E('div', {
        style:{ padding:'12px', borderBottom:'1px solid var(--border)', display:'flex', gap:'12px', alignItems:'flex-start' }
      });
      row.appendChild(E('div', { style:{ flex:'1', minWidth:'0' }}, [
        E('div', { style:{ fontFamily:"'Inter', system-ui, sans-serif", fontSize:'15px', marginBottom:'4px' }}, capitalize(canonical)),
        E('div', { style:{ fontSize:'12px', color:'var(--text-muted)' }}, 'объединяет: ' + aliases.join(', '))
      ]));
      row.appendChild(E('button', {
        className:'icon-x',
        title:'Удалить объединение',
        onClick: async () => {
          if (await confirmDialog(`Удалить объединение «${capitalize(canonical)}»?`)) {
            for (const a of aliases) {
              await db.ingredient_synonyms.delete(a);
            }
            closeModal();
            renderRoute();
          }
        }
      }, '×'));
      list.appendChild(row);
    });
    body.appendChild(list);

    const footer = E('div', { className:'modal-footer' });
    footer.appendChild(E('span'));
    footer.appendChild(E('button', { className:'btn btn-secondary', onClick: closeModal }, 'Закрыть'));
    body.appendChild(footer);
  });
}

function copyShoppingList(groups) {
  const lines = groups.map(g => {
    const w = g.weight ? ' — ' + g.weight : '';
    const r = g.recipes && g.recipes.length ? '  (' + g.recipes.join(', ') + ')' : '';
    return '• ' + g.name + w + r;
  });
  const text = 'Список покупок\n\n' + lines.join('\n');
  if (navigator.clipboard?.writeText) {
    navigator.clipboard.writeText(text).then(
      () => alert('Скопировано в буфер обмена'),
      () => fallbackCopy(text)
    );
  } else {
    fallbackCopy(text);
  }
}
function fallbackCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); alert('Скопировано'); }
  catch (e) { alert('Не удалось скопировать. Скопируйте вручную:\n\n' + text); }
  document.body.removeChild(ta);
}

// === Режим объединения похожих ингредиентов ===
function startMergeMode(groups) {
  const selected = new Set();
  openModal('Объединить ингредиенты', (body) => {
    body.appendChild(E('p', {
      style:{ fontSize:'14px', color:'var(--text-muted)', margin:'0 0 12px', lineHeight:'1.5' }
    }, 'Отметьте 2 или больше похожих пунктов (например, «Помидоры» и «помидоры»). Они объединятся в один и будут объединяться автоматически в будущих списках.'));

    const list = E('div', { style:{ border:'1px solid var(--border)', maxHeight:'50vh', overflowY:'auto' }});

    function rebuildList() {
      list.innerHTML = '';
      groups.forEach((g, idx) => {
        const isSelected = selected.has(idx);
        const row = E('label', {
          style: {
            display:'flex', alignItems:'center', gap:'12px',
            padding:'12px', borderBottom:'1px solid var(--border)',
            cursor:'pointer',
            background: isSelected ? 'var(--bg-elevated)' : 'transparent',
            WebkitTapHighlightColor:'transparent'
          }
        });
        const cb = E('input', {
          type:'checkbox',
          style:{ width:'22px', height:'22px', accentColor:'var(--accent)', flexShrink:'0' }
        });
        cb.checked = isSelected;
        cb.addEventListener('change', () => {
          if (cb.checked) selected.add(idx);
          else selected.delete(idx);
          rebuildList();
          updateActions();
        });
        row.appendChild(cb);
        row.appendChild(E('div', { style:{ flex:'1', minWidth:'0' }}, [
          E('div', { style:{ fontFamily:"'Inter', system-ui, sans-serif", fontSize:'15px' }}, g.name),
          g.weight ? E('div', { className:'mono', style:{ fontSize:'12px', color:'var(--text-muted)' }}, g.weight) : null
        ]));
        list.appendChild(row);
      });
    }
    rebuildList();
    body.appendChild(list);

    // Поле для канонического имени появится после выбора
    const canonicalWrap = E('div', { style:{ marginTop:'16px', display:'none' }});
    canonicalWrap.appendChild(E('label', { style:{ display:'block' }}, [
      E('span', { className:'field-label' }, 'Объединить как (каноническое имя)'),
      // input будет добавлен далее
    ]));
    const canonicalInput = E('input', { type:'text', className:'field', placeholder:'Название для объединённого пункта' });
    canonicalWrap.querySelector('label').appendChild(canonicalInput);
    body.appendChild(canonicalWrap);

    const status = E('div', { style:{ fontSize:'13px', minHeight:'18px', marginTop:'12px', color:'var(--text-muted)' }});
    body.appendChild(status);

    const footer = E('div', { className:'modal-footer' });
    const mergeBtn = E('button', { className:'btn btn-primary', disabled:true, onClick: async () => {
      const selectedItems = [...selected].map(i => groups[i]);
      if (selectedItems.length < 2) return;
      const canonical = canonicalInput.value.trim();
      if (!canonical) {
        status.textContent = 'Введите каноническое имя';
        status.style.color = 'var(--accent-rust)';
        return;
      }
      const canonicalKey = canonical.toLowerCase();
      // Сохраняем все выбранные имена как алиасы канонического
      const aliases = selectedItems.map(g => normalizeIngredientKey(g.name));
      // Также добавляем само каноническое имя — на случай если потом пользователь напишет «Помидоры» и захочет туда же
      aliases.push(canonicalKey);
      const tx = db.transaction('rw', db.ingredient_synonyms, async () => {
        for (const a of aliases) {
          if (a !== canonicalKey) {
            await db.ingredient_synonyms.put({ alias: a, canonical: canonicalKey });
          }
        }
      });
      await tx;
      closeModal();
      renderRoute();
    }}, 'Объединить');
    footer.appendChild(E('button', { className:'btn btn-secondary', onClick: closeModal }, 'Отмена'));
    footer.appendChild(mergeBtn);
    body.appendChild(footer);

    function updateActions() {
      const n = selected.size;
      if (n >= 2) {
        canonicalWrap.style.display = 'block';
        // По умолчанию подставляем имя первого выбранного, в нижнем регистре с заглавной первой буквы
        if (!canonicalInput.value) {
          const firstSelected = groups[[...selected][0]];
          canonicalInput.value = capitalize(firstSelected.name);
        }
        mergeBtn.disabled = false;
        status.textContent = `Выбрано: ${n}`;
        status.style.color = 'var(--text-muted)';
      } else {
        canonicalWrap.style.display = 'none';
        mergeBtn.disabled = true;
        status.textContent = n === 1 ? 'Выберите ещё хотя бы один пункт' : '';
        status.style.color = 'var(--text-muted)';
      }
    }
  });
}

function escapeHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// Подсветить совпадение в строке
function highlight(text, query) {
  if (!query) return escapeHtml(text || '');
  const t = String(text || '');
  const q = query.toLowerCase();
  const idx = t.toLowerCase().indexOf(q);
  if (idx === -1) return escapeHtml(t);
  return escapeHtml(t.slice(0, idx))
    + '<span class="search-mark">' + escapeHtml(t.slice(idx, idx + q.length)) + '</span>'
    + escapeHtml(t.slice(idx + q.length));
}

// Проверка совпадения с обрезанным текстом для отображения
function matchPreview(fields, query) {
  // fields — { label: value } объект; ищем первое поле, в котором есть совпадение
  // Возвращает { label, html } для отображения в результате
  const q = query.toLowerCase();
  for (const [label, value] of Object.entries(fields)) {
    if (!value) continue;
    const v = String(value);
    const idx = v.toLowerCase().indexOf(q);
    if (idx !== -1) {
      // Обрезаем для контекста
      const start = Math.max(0, idx - 30);
      const end = Math.min(v.length, idx + q.length + 60);
      const prefix = start > 0 ? '…' : '';
      const suffix = end < v.length ? '…' : '';
      return { label, html: prefix + highlight(v.slice(start, end), query) + suffix };
    }
  }
  return null;
}

async function renderSearchResults(query) {
  const container = document.getElementById('searchResults');
  container.innerHTML = '';
  const q = (query || '').trim();

  if (q.length === 0) {
    container.innerHTML = `
      <div class="search-empty">
        Начните вводить текст для поиска
        <div class="search-empty-hint">Ищем по названиям, описаниям, заметкам, номерам — везде, кроме паролей</div>
      </div>
    `;
    return;
  }
  if (q.length < 2) {
    container.innerHTML = '<div class="search-empty">Введите минимум 2 символа</div>';
    return;
  }

  const groups = await searchEverywhere(q);
  if (groups.length === 0) {
    container.innerHTML = `<div class="search-empty">Ничего не найдено по запросу <strong>«${escapeHtml(q)}»</strong></div>`;
    return;
  }

  groups.forEach(g => {
    const groupEl = E('div', { className: 'search-result-group' });
    groupEl.appendChild(E('div', { className: 'search-result-group-title' }, g.title + ' · ' + g.items.length));
    g.items.forEach(it => {
      const link = E('a', {
        href: it.href,
        className: 'search-result-item',
        onClick: () => closeSearch()
      });
      link.appendChild(E('div', { className: 'search-result-title', html: highlight(it.title, q) }));
      if (it.preview) {
        link.appendChild(E('div', { className: 'search-result-meta', html: it.preview.label + ': ' + it.preview.html }));
      } else if (it.meta) {
        link.appendChild(E('div', { className: 'search-result-meta' }, it.meta));
      }
      groupEl.appendChild(link);
    });
    container.appendChild(groupEl);
  });
}

async function searchEverywhere(q) {
  const ql = q.toLowerCase();
  const groups = [];

  // Дни рождения
  const bd = await db.birthdays.toArray();
  const bdMatches = bd.filter(b => {
    return (b.name && b.name.toLowerCase().includes(ql))
        || (b.note && b.note.toLowerCase().includes(ql));
  }).map(b => ({
    title: b.name || '—',
    href: '#/birthdays',
    preview: matchPreview({ 'Заметка': b.note }, q),
    meta: fmtDate(b.date)
  }));
  if (bdMatches.length) groups.push({ title: 'Дни рождения', items: bdMatches });

  // Документы
  const docs = await db.documents.toArray();
  const docMatches = docs.filter(d => {
    return ['title','series_number','issued_by','note'].some(f => d[f] && d[f].toLowerCase().includes(ql));
  }).map(d => ({
    title: d.title || '—',
    href: '#/documents',
    preview: matchPreview({
      'Серия и номер': d.series_number,
      'Кем выдан': d.issued_by,
      'Примечание': d.note
    }, q),

      }, q),
      meta: (carById.get(p.car_id)?.name) || null
    }))});
  }

  // ТО
  const maint = await db.car_maintenance.toArray();
  const maintMatches = maint.filter(m => {
    return ['operation_name','note'].some(f => m[f] && m[f].toLowerCase().includes(ql));
  });
  if (maintMatches.length) {
    const carById = new Map(cars.map(c => [c.id, c]));
    groups.push({ title: 'Техобслуживание', items: maintMatches.map(m => ({
      title: m.operation_name || '—',
      href: '#/cars/' + m.car_id,
      preview: matchPreview({ 'Примечание': m.note }, q),
      meta: (carById.get(m.car_id)?.name || '') + (m.date ? ' · ' + fmtDate(m.date) : '')
    }))});
  }

  // Гарантии товаров
  const wG = await db.warranties_goods.toArray();
  const wgMatches = wG.filter(w => {
    return ['item_name','store','serial_number','note'].some(f => w[f] && w[f].toLowerCase().includes(ql));
  }).map(w => ({
    title: w.item_name || '—',
    href: '#/warranties-goods',
    preview: matchPreview({
      'Магазин': w.store, 'Серийный номер': w.serial_number, 'Примечание': w.note
    }, q),
    meta: w.warranty_until ? 'до ' + fmtDate(w.warranty_until) : null
  }));
  if (wgMatches.length) groups.push({ title: 'Гарантии товаров', items: wgMatches });

  // Гарантии услуг
  const wS = await db.warranties_services.toArray();
  const wsMatches = wS.filter(w => {
    return ['service_name','provider','note'].some(f => w[f] && w[f].toLowerCase().includes(ql));
  }).map(w => ({
    title: w.service_name || '—',
    href: '#/warranties-services',
    preview: matchPreview({ 'Исполнитель': w.provider, 'Примечание': w.note }, q),
    meta: w.warranty_until ? 'до ' + fmtDate(w.warranty_until) : null
  }));
  if (wsMatches.length) groups.push({ title: 'Гарантии услуг', items: wsMatches });

  // Профили здоровья
  const hp = await db.health_profiles.toArray();
  const hpMatches = hp.filter(p => {
    return ['name','allergies','chronic_conditions'].some(f => p[f] && p[f].toLowerCase().includes(ql));
  }).map(p => ({
    title: p.name || '—',
    href: '#/health/' + p.id,
    preview: matchPreview({ 'Аллергии': p.allergies, 'Хронические': p.chronic_conditions }, q),
    meta: 'Профиль здоровья'
  }));
  if (hpMatches.length) groups.push({ title: 'Профили здоровья', items: hpMatches });

  // Медицинские записи
  const hr = await db.health_records.toArray();
  const hrMatches = hr.filter(r => {
    return ['specialist','clinic','diagnosis','prescriptions','note'].some(f => r[f] && r[f].toLowerCase().includes(ql));
  });
  if (hrMatches.length) {
    const profById = new Map(hp.map(p => [p.id, p]));
    groups.push({ title: 'Медицинские записи', items: hrMatches.map(r => ({
      title: r.specialist || r.diagnosis || '—',
      href: '#/health/' + r.profile_id,
      preview: matchPreview({
        'Клиника': r.clinic, 'Диагноз': r.diagnosis, 'Назначения': r.prescriptions, 'Примечание': r.note
      }, q),
      meta: (profById.get(r.profile_id)?.name || '') + (r.date ? ' · ' + fmtDate(r.date) : '')
    }))});
  }

  // Рецепты
  const recipes = await db.recipes.toArray();
  const recipeMatches = recipes.filter(r => {
    if (r.name && r.name.toLowerCase().includes(ql)) return true;
    if (r.instructions && r.instructions.toLowerCase().includes(ql)) return true;
    if (r.note && r.note.toLowerCase().includes(ql)) return true;
    if (r.ingredients && r.ingredients.some(i => i.name && i.name.toLowerCase().includes(ql))) return true;
    return false;
  }).map(r => {
    let preview = matchPreview({
      'Описание': r.instructions, 'Примечание': r.note
    }, q);
    if (!preview && r.ingredients) {
      const ingMatch = r.ingredients.find(i => i.name && i.name.toLowerCase().includes(ql));
      if (ingMatch) {
        preview = { label: 'Ингредиент', html: highlight(ingMatch.name, q) + (ingMatch.weight ? ' — ' + escapeHtml(ingMatch.weight) : '') };
      }
    }
    return {
      title: r.name || '—',
      href: '#/recipes/' + r.id,
      preview,
      meta: r.calories ? r.calories + ' ккал' : null
    };
  });
  if (recipeMatches.length) groups.push({ title: 'Рецепты', items: recipeMatches });

  // Заметки
  const notes = await db.notes.toArray();
  const noteMatches = notes.filter(n => {
    return (n.title && n.title.toLowerCase().includes(ql))
        || (n.content && n.content.toLowerCase().includes(ql))
        || (n.category && n.category.toLowerCase().includes(ql))
        || (n.tags && Array.isArray(n.tags) && n.tags.some(t => t.toLowerCase().includes(ql)));
  }).map(n => ({
    title: n.title || 'Без названия',
    href: '#/notes/' + n.id,
    preview: matchPreview({ 'Содержимое': n.content, 'Категория': n.category }, q),
    meta: n.category ? n.category + (n.tags && n.tags.length ? ' · ' + n.tags.join(', ') : '') : null
  }));
  if (noteMatches.length) groups.push({ title: 'Заметки', items: noteMatches });

  return groups;
}

function renderMarkdown(text) {
  if (!text) return '';
  let html = escapeHtml(text);
  html = html.replace(/^### (.+)$/gm, '<h4 style="margin:16px 0 6px;font-size:15px;font-weight:600;font-family:Inter,system-ui,sans-serif;">$1</h4>');
  html = html.replace(/^## (.+)$/gm, '<h3 style="margin:20px 0 8px;font-size:17px;font-weight:600;font-family:Inter,system-ui,sans-serif;">$1</h3>');
  html = html.replace(/^# (.+)$/gm, '<h2 style="margin:24px 0 10px;font-size:20px;font-weight:600;font-family:Inter,system-ui,sans-serif;">$1</h2>');
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  html = html.replace(/_(.+?)_/g, '<em>$1</em>');
  html = html.replace(/`([^`\n]+)`/g, '<code style="background:var(--border);padding:1px 5px;font-family:\'IBM Plex Mono\',monospace;font-size:13px;border-radius:2px;">$1</code>');
  html = html.replace(/```[\w]*\n([\s\S]*?)```/g, '<pre style="background:var(--bg-elevated);border:1px solid var(--border);padding:12px;overflow-x:auto;margin:10px 0;font-family:\'IBM Plex Mono\',monospace;font-size:13px;line-height:1.5;white-space:pre-wrap;">$1</pre>');
  html = html.replace(/^[*-] (.+)$/gm, '<li style="margin:3px 0 3px 20px;list-style:disc;">$1</li>');
  html = html.replace(/^\d+\. (.+)$/gm, '<li style="margin:3px 0 3px 20px;list-style:decimal;">$1</li>');
  html = html.replace(/^---$/gm, '<hr style="border:none;border-top:1px solid var(--border);margin:16px 0;">');
  html = html.replace(/\n\n+/g, '</p><p style="margin:0 0 12px;">');
  html = '<p style="margin:0 0 12px;">' + html + '</p>';
  html = html.replace(/\n/g, '<br>');
  return html;
}

async function renderNotes() {
  const root = document.getElementById('app');
  root.innerHTML = '';

  let allNotes = await db.notes.toArray();
  allNotes.sort((a,b) => {
    if (a.pinned && !b.pinned) return -1;
    if (!a.pinned && b.pinned) return 1;
    return new Date(b.updated_at) - new Date(a.updated_at);
  });

  const categories = [...new Set(allNotes.map(n => n.category).filter(Boolean))].sort();
  let filterCat = '', filterQuery = '';

  function getFiltered() {
    return allNotes.filter(n => {
      if (filterCat && n.category !== filterCat) return false;
      if (filterQuery) {
        const q = filterQuery.toLowerCase();
        return (n.title && n.title.toLowerCase().includes(q))
            || (n.content && n.content.toLowerCase().includes(q))
            || (n.tags && n.tags.some(t => t.toLowerCase().includes(q)));
      }
      return true;
    });
  }

  const header = E('div', { className:'page-header' });
  const h1 = E('h1', {}, 'Заметки');
  const countSpan = E('span', { className:'count' }, String(allNotes.length));
  h1.appendChild(countSpan);
  header.appendChild(E('div', {}, [h1]));
  const addBtn = E('button', {
    className:'btn btn-primary fab-mirror',
    onClick: () => openNoteModal(null, async () => {
      allNotes = await db.notes.toArray();
      allNotes.sort((a,b) => { if(a.pinned&&!b.pinned)return -1; if(!a.pinned&&b.pinned)return 1; return new Date(b.updated_at)-new Date(a.updated_at); });
      countSpan.textContent = String(allNotes.length);
      rerenderList();
    })
  }, '+ Добавить');
  header.appendChild(E('div', { className:'row-end' }, [addBtn]));
  root.appendChild(header);

  const filterRow = E('div', { style:{ display:'flex', gap:'8px', marginBottom:'16px', flexWrap:'wrap' }});
  const searchInp = E('input', { type:'search', className:'field', placeholder:'Поиск по заметкам...', style:{ flex:'1', minWidth:'180px' }});
  searchInp.addEventListener('input', () => { filterQuery = searchInp.value; rerenderList(); });
  filterRow.appendChild(searchInp);
  if (categories.length > 0) {
    const catSel = E('select', { className:'field', style:{ flexShrink:'0', width:'auto', minWidth:'140px' }});
    catSel.appendChild(E('option', { value:'' }, 'Все категории'));
    categories.forEach(c => catSel.appendChild(E('option', { value:c }, c)));
    catSel.addEventListener('change', () => { filterCat = catSel.value; rerenderList(); });
    filterRow.appendChild(catSel);
  }
  root.appendChild(filterRow);

  const listContainer = E('div', { className:'stack' });
  root.appendChild(listContainer);

  function rerenderList() {
    listContainer.innerHTML = '';
    const filtered = getFiltered();
    if (filtered.length === 0) {
      const empty = E('div', { className:'empty' });
      empty.appendChild(E('div', { className:'empty-icon' }, '📝'));
      empty.appendChild(E('div', { className:'empty-title' }, allNotes.length === 0 ? 'Нет заметок' : 'Ничего не найдено'));
      empty.appendChild(E('div', { className:'empty-hint' }, allNotes.length === 0 ? 'Нажмите «+ Добавить», чтобы создать первую заметку' : 'Попробуйте изменить запрос или фильтр'));
      listContainer.appendChild(empty);
      return;
    }
    filtered.forEach(note => {
      const card = E('div', { className:'item-row', style:{ cursor:'pointer', flexDirection:'column', gap:'6px' }, onClick: () => { location.hash = '#/notes/' + note.id; }});
      const topRow = E('div', { style:{ display:'flex', alignItems:'flex-start', gap:'8px', justifyContent:'space-between' }});
      const titleEl = E('div', { className:'item-title flex-1' });
      if (note.pinned) titleEl.appendChild(E('span', { style:{ marginRight:'6px', fontSize:'14px' }}, '📌'));
      titleEl.appendChild(document.createTextNode(note.title || 'Без названия'));
      topRow.appendChild(titleEl);
      topRow.appendChild(E('span', { className:'mono', style:{ fontSize:'11px', color:'var(--text-soft)', flexShrink:'0', marginTop:'3px' }}, new Date(note.updated_at).toLocaleDateString('ru-RU', { day:'2-digit', month:'2-digit', year:'2-digit' })));
      card.appendChild(topRow);
      if (note.content) {
        const preview = note.content.replace(/#{1,6} /g,'').replace(/[*_`]/g,'').slice(0,160);
        card.appendChild(E('div', { style:{ fontSize:'13px', color:'var(--text-muted)', lineHeight:'1.5' }}, preview + (note.content.length > 160 ? '…' : '')));
      }
      if (note.category || (note.tags && note.tags.length)) {
        const meta = E('div', { style:{ display:'flex', gap:'6px', flexWrap:'wrap', alignItems:'center', marginTop:'2px' }});
        if (note.category) meta.appendChild(E('span', { style:{ fontSize:'11px', padding:'2px 8px', background:'var(--bg)', border:'1px solid var(--border)', color:'var(--text-muted)', textTransform:'uppercase', letterSpacing:'0.05em' }}, note.category));
        if (note.tags && note.tags.length) {
          note.tags.slice(0,4).forEach(tag => meta.appendChild(E('span', { style:{ fontSize:'11px', padding:'2px 8px', background:'var(--bg-elevated)', border:'1px solid var(--border)', color:'var(--text-soft)' }}, '#' + tag)));
          if (note.tags.length > 4) meta.appendChild(E('span', { style:{ fontSize:'11px', color:'var(--text-soft)' }}, '+' + (note.tags.length-4)));
        }
        card.appendChild(meta);
      }
      listContainer.appendChild(card);
    });
  }

  rerenderList();
  setFAB(() => openNoteModal(null, async () => {
    allNotes = await db.notes.toArray();
    allNotes.sort((a,b) => { if(a.pinned&&!b.pinned)return -1; if(!a.pinned&&b.pinned)return 1; return new Date(b.updated_at)-new Date(a.updated_at); });
    countSpan.textContent = String(allNotes.length);
    rerenderList();
  }), 'Новая заметка');
}

function openNoteModal(note, onSave) {
  const isEdit = !!note;
  openModal(isEdit ? 'Редактировать заметку' : 'Новая заметка', async (body) => {
    let aiLoading = false;

    const titleF = field('Заголовок', { value: note?.title || '', required: true, placeholder: 'Название заметки' });
    body.appendChild(titleF);

    const contentWrap = E('div', { style:{ marginTop:'12px' }});
    contentWrap.appendChild(E('span', { className:'field-label', style:{ display:'block', marginBottom:'4px' }}, 'Содержимое (Markdown)'));
    const toolbar = E('div', { style:{ display:'flex', gap:'4px', marginBottom:'6px', flexWrap:'wrap', alignItems:'center' }});
    const aiStatus = E('span', { style:{ fontSize:'11px', color:'var(--text-muted)', marginLeft:'4px' }});
    toolbar.appendChild(aiStatus);
    const contentTA = E('textarea', { className:'field', rows:10, placeholder:'# Заголовок\n\nПишите в Markdown...\n\n**Жирный**, *курсив*, `код`\n\n- список\n- элементов', style:{ fontFamily:"'IBM Plex Mono',monospace", fontSize:'13px', lineHeight:'1.6' }});
    contentTA.value = note?.content || '';
    contentWrap.appendChild(toolbar);
    contentWrap.appendChild(contentTA);
    body.appendChild(contentWrap);

    // AI-кнопки
    (async () => {
      const keyRec = await db.settings.get('claude_api_key');
      const apiKey = keyRec?.value;
      if (!apiKey) {
        const hint = E('a', { href:'#/settings', style:{ fontSize:'11px', color:'var(--accent)' }, onClick: closeModal }, '⚡ Добавьте API ключ для AI-помощи');
        toolbar.insertBefore(hint, aiStatus);
        return;
      }
      async function callAI(systemPrompt, userContent) {
        if (aiLoading) return null;
        aiLoading = true;
        aiStatus.textContent = '⏳ AI работает...';
        try {
          const resp = await fetch('https://api.anthropic.com/v1/messages', {
            method:'POST',
            headers:{ 'x-api-key':apiKey, 'anthropic-version':'2023-06-01', 'content-type':'application/json', 'anthropic-dangerous-direct-browser-access':'true' },
            body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:2048, system:systemPrompt, messages:[{role:'user',content:userContent}] })
          });
          if (!resp.ok) { const e=await resp.json().catch(()=>({})); throw new Error(e.error?.message||'Ошибка '+resp.status); }
          const data = await resp.json();
          return data.content[0]?.text || '';
        } catch(e) {
          aiStatus.textContent = '❌ ' + e.message;
          setTimeout(()=>{aiStatus.textContent='';},4000);
          return null;
        } finally {
          aiLoading = false;
          if (aiStatus.textContent === '⏳ AI работает...') aiStatus.textContent = '';
        }
      }
      const btns = [
        { label:'✨ Улучшить', sys:'Улучши стиль, структуру и ясность заметки. Сохрани markdown. Только улучшенный текст, без пояснений.' },
        { label:'📝 Сократить', sys:'Создай краткое структурированное резюме на русском. Используй markdown. Только резюме.' },
        { label:'📖 Развернуть', sys:'Дополни и расширь текст полезными деталями и примерами. Сохрани markdown. Только текст.' },
        { label:'✓ Исправить', sys:'Исправь грамматику, орфографию и пунктуацию. Сохрани markdown. Только исправленный текст.' }
      ];
      btns.forEach(btn => {
        const b = E('button', { type:'button', className:'btn btn-ghost', style:{ fontSize:'12px', padding:'4px 8px', minHeight:'28px' }, onClick: async () => {
          const text = contentTA.value.trim();
          if (!text) return;
          const result = await callAI(btn.sys, text);
          if (result) { contentTA.value = result; aiStatus.textContent = '✓ Готово'; setTimeout(()=>{aiStatus.textContent='';},2000); }
        }}, btn.label);
        toolbar.insertBefore(b, aiStatus);
      });
    })();

    const catF = field('Категория', { value: note?.category || '', placeholder: 'Работа, Личное, Идеи...' });
    catF.style.marginTop = '12px';
    body.appendChild(catF);

    const tagsF = field('Теги (через запятую)', { value: note?.tags ? note.tags.join(', ') : '', placeholder: 'идея, python, проект' });
    tagsF.style.marginTop = '12px';
    body.appendChild(tagsF);

    const pinnedF = checkboxField('Закрепить заметку', { value: note?.pinned || false });
    pinnedF.style.marginTop = '12px';
    body.appendChild(pinnedF);

    // Связанные заметки
    const allNotes = await db.notes.toArray();
    const othersNotes = allNotes.filter(n => !note || n.id !== note.id);
    const linkedSet = new Set(note?.linked_notes || []);
    let linkedScroll = null;
    if (othersNotes.length > 0) {
      const linkedWrap = E('div', { style:{ marginTop:'12px' }});
      linkedWrap.appendChild(E('span', { className:'field-label', style:{ display:'block', marginBottom:'6px' }}, 'Связанные заметки'));
      linkedScroll = E('div', { style:{ maxHeight:'120px', overflowY:'auto', border:'1px solid var(--border)', padding:'4px' }});
      othersNotes.forEach(n => {
        const row = E('label', { className:'checkbox-row', style:{ padding:'4px 8px', minHeight:'32px' }});
        const cb = E('input', { type:'checkbox' });
        cb.checked = linkedSet.has(n.id);
        cb.addEventListener('change', () => { if(cb.checked) linkedSet.add(n.id); else linkedSet.delete(n.id); });
        row.appendChild(cb);
        row.appendChild(E('span', { style:{ fontSize:'13px' }}, n.title || 'Без названия'));
        linkedScroll.appendChild(row);
      });
      linkedWrap.appendChild(linkedScroll);
      body.appendChild(linkedWrap);
    }

    const footer = E('div', { className:'modal-footer' });
    footer.appendChild(E('button', { className:'btn btn-secondary', onClick: closeModal }, 'Отмена'));
    footer.appendChild(E('button', { className:'btn btn-primary', onClick: async () => {
      const title = titleF._input.value.trim();
      if (!title) { alert('Введите заголовок'); return; }
      const tags = tagsF._input.value.split(',').map(t => t.trim()).filter(Boolean);
      const linkedArr = [...linkedSet];
      const data = { title, content:contentTA.value, category:catF._input.value.trim(), tags, pinned:pinnedF._input.checked, linked_notes:linkedArr };
      if (isEdit) await updateItem('notes', note.id, data);
      else await addItem('notes', data);
      closeModal();
      if (onSave) onSave();
    }}, isEdit ? 'Сохранить' : 'Создать'));
    body.appendChild(footer);
  });
}

/* ============================================================
   PAGES — AI-ассистент
   ============================================================ */
async function renderAI() {
  const root = document.getElementById('app');
  root.innerHTML = '';
  setFAB(null);

  root.appendChild(E('div', { className:'page-header' }, [
    E('div', {}, [
      E('h1', {}, 'AI-ассистент'),
      E('div', { className:'subtitle' }, 'Задайте вопрос — отвечу на основе ваших заметок')
    ])
  ]));

  const keyRec = await db.settings.get('claude_api_key');
  const apiKey = keyRec?.value;

  if (!apiKey) {
    const warn = E('div', { style:{ background:'var(--warn-bg)', borderLeft:'3px solid var(--accent-rust)', padding:'16px', marginBottom:'24px' }});
    warn.appendChild(E('div', { style:{ fontWeight:'500', marginBottom:'4px' }}, '⚠ Нет API ключа'));
    warn.appendChild(E('div', { style:{ fontSize:'14px', color:'var(--text-muted)', marginBottom:'12px' }}, 'Для работы AI-ассистента нужен ключ Claude API. Получите его на console.anthropic.com'));
    warn.appendChild(E('a', { href:'#/settings', className:'btn btn-secondary', style:{ textDecoration:'none', display:'inline-flex' }}, '→ Настройки'));
    root.appendChild(warn);
    return;
  }

  const chatHistory = [];

  const chatWrap = E('div', { style:{ display:'flex', flexDirection:'column', border:'1px solid var(--border)', height:'62vh', minHeight:'280px' }});
  const messagesArea = E('div', { style:{ flex:'1', overflowY:'auto', padding:'16px', display:'flex', flexDirection:'column', gap:'12px' }});

  const welcomeEl = E('div', { style:{ textAlign:'center', padding:'32px 16px', color:'var(--text-muted)' }});
  welcomeEl.appendChild(E('div', { style:{ fontSize:'40px', marginBottom:'12px' }}, '🤖'));
  welcomeEl.appendChild(E('div', { style:{ fontSize:'15px', fontWeight:'500', color:'var(--text)', marginBottom:'8px', fontFamily:"'Inter',system-ui,sans-serif" }}, 'AI-ассистент готов'));
  welcomeEl.appendChild(E('div', { style:{ fontSize:'13px' }}, 'Задайте вопрос — найду ответ в ваших заметках'));
  messagesArea.appendChild(welcomeEl);
  chatWrap.appendChild(messagesArea);

  const inputArea = E('div', { style:{ borderTop:'1px solid var(--border)', padding:'12px', display:'flex', gap:'8px', alignItems:'flex-end' }});
  const questionTA = E('textarea', { className:'field', placeholder:'Задайте вопрос по вашим заметкам...', rows:2, style:{ flex:'1', resize:'none', fontSize:'14px' }});
  const sendBtn = E('button', { className:'btn btn-primary', style:{ flexShrink:'0', alignSelf:'flex-end' }, onClick: sendMessage }, 'Отправить');
  questionTA.addEventListener('keydown', e => { if (e.key==='Enter'&&!e.shiftKey) { e.preventDefault(); sendMessage(); }});
  inputArea.appendChild(questionTA);
  inputArea.appendChild(sendBtn);
  chatWrap.appendChild(inputArea);
  root.appendChild(chatWrap);

  const notesCount = await db.notes.count();
  root.appendChild(E('div', { style:{ fontSize:'12px', color:'var(--text-soft)', marginTop:'8px', textAlign:'right' }}, `Заметок в базе: ${notesCount}`));

  function addMessage(role, text, sources) {
    if (welcomeEl.parentNode) welcomeEl.remove();
    const isUser = role==='user', isError = role==='error';
    const wrap = E('div', { style:{ display:'flex', flexDirection:isUser?'row-reverse':'row', gap:'8px', alignItems:'flex-start' }});
    const bubble = E('div', { style:{ maxWidth:'82%', padding:'10px 14px', fontSize:'14px', lineHeight:'1.6', background:isUser?'var(--accent)':isError?'var(--warn-bg)':'var(--bg-elevated)', color:isUser?'var(--accent-on)':isError?'var(--accent-rust)':'var(--text)', border:isUser?'none':'1px solid var(--border)' }});
    if (isUser||isError) bubble.textContent = text;
    else bubble.innerHTML = renderMarkdown(text);
    if (sources && sources.length) {
      const srcEl = E('div', { style:{ marginTop:'10px', paddingTop:'8px', borderTop:'1px solid var(--border)', fontSize:'12px', color:'var(--text-muted)' }});
      srcEl.appendChild(E('div', { style:{ marginBottom:'4px', fontWeight:'500' }}, 'Источники:'));
      sources.forEach(s => srcEl.appendChild(E('a', { href:'#/notes/'+s.id, style:{ display:'block', color:'var(--accent)', textDecoration:'none', padding:'2px 0' }}, '→ '+s.title)));
      bubble.appendChild(srcEl);
    }
    wrap.appendChild(bubble);
    messagesArea.appendChild(wrap);
    messagesArea.scrollTop = messagesArea.scrollHeight;
    return wrap;
  }

  async function sendMessage() {
    const question = questionTA.value.trim();
    if (!question) return;
    questionTA.value = '';
    sendBtn.disabled = true;
    addMessage('user', question);

    const allNotes = await db.notes.toArray();
    const qWords = question.toLowerCase().split(/\s+/).filter(w => w.length > 2);
    const scored = allNotes.map(n => {
      const text = ((n.title||'')+' '+(n.content||'')+' '+(n.tags||[]).join(' ')).toLowerCase();
      const score = qWords.reduce((s,w) => s+(text.split(w).length-1), 0);
      return { note:n, score };
    }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score).slice(0,5);

    const loadingEl = addMessage('assistant', '⏳ Думаю...');

    const context = scored.length
      ? '\n\nДоступные заметки:\n\n' + scored.map((x,i) => `[${i+1}] ${x.note.title||'Без названия'}\n${x.note.content||''}`).join('\n\n---\n\n')
      : '\n\nЗаметки по данной теме не найдены.';

    chatHistory.push({ role:'user', content: question + context });

    try {
      const resp = await fetch('https://api.anthropic.com/v1/messages', {
        method:'POST',
        headers:{ 'x-api-key':apiKey, 'anthropic-version':'2023-06-01', 'content-type':'application/json', 'anthropic-dangerous-direct-browser-access':'true' },
        body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:1024, system:'Ты — AI-ассистент базы знаний. Отвечай на вопросы используя ТОЛЬКО предоставленные заметки. Если информации недостаточно — скажи об этом честно. Указывай источник в квадратных скобках [Название заметки]. Отвечай на русском, кратко и по делу.', messages:chatHistory })
      });
      if (!resp.ok) { const e=await resp.json().catch(()=>({})); throw new Error(e.error?.message||'Ошибка '+resp.status); }
      const data = await resp.json();
      const answer = data.content[0]?.text || 'Нет ответа';
      chatHistory.push({ role:'assistant', content:answer });
      loadingEl.remove();
      addMessage('assistant', answer, scored.map(x=>({id:x.note.id, title:x.note.title||'Без названия'})));
    } catch(e) {
      loadingEl.remove();
      addMessage('error', '❌ Ошибка: '+e.message);
    } finally {
      sendBtn.disabled = false;
      questionTA.focus();
    }
  }
}

/* ============================================================
   ROUTER
   ============================================================ */
function renderRoute() {
  const h = location.hash || '#/';
  setNavTitle();
  renderNavMenu();
  setFAB(null);
  if (h === '#/' || h === '') renderHome();
  else if (h === '#/birthdays') renderBirthdays();
  else if (h === '#/documents') renderDocuments();
  else if (h === '#/cars') renderCars();
  else if (h.startsWith('#/cars/')) renderCarDetail(Number(h.split('/')[2]));
  else if (h === '#/warranties-goods') renderWarrantiesGoods();
  else if (h === '#/warranties-services') renderWarrantiesServices();
  else if (h === '#/health') renderHealth();
  else if (h.startsWith('#/health/')) renderHealthProfileDetail(Number(h.split('/')[2]));
  else if (h === '#/recipes') renderRecipes();
  else if (h === '#/shopping-list') renderShoppingList();
  else if (h.startsWith('#/recipes/')) renderRecipeDetail(Number(h.split('/')[2]));
  else if (h === '#/notes') renderNotes();
  else if (h.startsWith('#/notes/')) renderNoteDetail(Number(h.split('/')[2]));
  else if (h === '#/ai') renderAI();
  else if (h === '#/more') renderMore();
  else if (h === '#/settings') renderSettings();
  else { location.hash = '#/'; }
}

window.addEventListener('hashchange', renderRoute);
renderRoute();
</script>
